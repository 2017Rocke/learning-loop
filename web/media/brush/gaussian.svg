<radialGradient id="red"><stop stop-color="#F47C70" stop-opacity=".94"/><stop offset=".48" stop-color="#F47C70" stop-opacity=".72"/><stop offset="1" stop-color="#F47C70" stop-opacity="0"/></radialGradient>
