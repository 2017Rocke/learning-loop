<radialGradient id="cloud-violet"><stop stop-color="#c8adff" stop-opacity=".95"/><stop offset=".6" stop-color="#a27de2" stop-opacity=".5"/><stop offset="1" stop-color="#a27de2" stop-opacity="0"/></radialGradient>
<radialGradient id="cloud-red"><stop stop-color="#ffa39f" stop-opacity=".96"/><stop offset=".6" stop-color="#ec7d92" stop-opacity=".54"/><stop offset="1" stop-color="#ec7d92" stop-opacity="0"/></radialGradient>
<radialGradient id="cloud-blue"><stop stop-color="#7fcaff" stop-opacity=".95"/><stop offset=".6" stop-color="#579ff0" stop-opacity=".5"/><stop offset="1" stop-color="#579ff0" stop-opacity="0"/></radialGradient>
</defs><rect width="640" height="360" rx="24" fill="#142641"/><path d="M18 72H622M18 316H622" fill="none" stroke="#35516b" stroke-width="1.5"/><path d="M18 40V18H40M600 18H622V40M622 320V342H600M40 342H18V320" fill="none" stroke="#e9c778" stroke-opacity=".6" stroke-width="1.5"/><g transform="translate(598 48) scale(0.42)">
<path d="M-7-25V-33Q0-42 7-33V-25" stroke="#e9c778" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<path d="M-18-20L0-28L18-20L23 10L10 26H-10L-23 10Z" fill="#78cfbd" stroke="#c9efe3" stroke-width="2"/>
<path d="M-14-15L0-20L14-15L16 9L0 17L-16 9Z" fill="#d3f4c7"/>
<path d="M-6-5V-2M7-5V-2" stroke="#375960" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M-3 5Q1 9 5 5" stroke="#375960" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
<path d="M-8 27H8L6 32H-6Z" fill="#e9c778"/>
</g><text x="305" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="29" font-weight="600" fill="#f2f1ff">听到报警，就换一组来数</text><path d="M41 94H47M44 91V97" stroke="#e9c778" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M589 287H595M592 284V290" stroke="#e9c778" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M564 89H568M566 87V91" stroke="#e9c778" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="157" y="109" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="600" fill="#ff9f77">× 真报警 90</text><text x="459" y="109" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="600" fill="#8bcaff">✓ 误报警 495</text><rect x="62" y="126" width="516" height="108" rx="20" fill="#213b59" stroke="#d6b66a" stroke-width="2"/><rect x="90" y="149" width="455" height="39" rx="0" fill="#8bcaff"/><rect x="90" y="149" width="70" height="39" fill="#ff9f77"/><path d="M125 121V140" stroke="#ff9f77" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M439 121V140" stroke="#8bcaff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="320" y="219" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="600" fill="#e9c778">全部报警：90 + 495 = 585</text><text x="320" y="289" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="600" fill="#f2f1ff">90 ÷ 585 ≈ 15.4%</text><text x="320" y="344" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#e9c778">条形宽度按报警件数绘制</text></svg>
