<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title"><title id="title">仅在585个报警件中计算：90真报警加495误报警。条形宽度按90比495绘制，坏件比例90除以585约15.4%。</title><defs>
