<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="黄铜机巧室 · 关门后还有路"><defs><marker id="blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#317eb2"/></marker><marker id="purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9260ac"/></marker><marker id="coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc775d"/></marker><marker id="mint" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62d4ba"/></marker></defs><desc>MOS开关在下方断开。珊瑚色约定电流从线圈下端经右侧外部二极管的A到K、回到线圈上端再通过线圈。二极管K在上，A在下。闭环没有穿过下方MOS断口，线圈电流逐渐减小。</desc><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="720" height="405" rx="20" fill="#efe4cc" stroke="none" stroke-width="2"/><rect x="16" y="66" width="688" height="286" rx="18" fill="#fff9e9" stroke="#ad8148" stroke-width="2"/><rect x="25" y="20" width="34" height="30" rx="6" fill="#d6aa61" stroke="#7d5a31" stroke-width="2"/><circle cx="35" cy="33" r="3" fill="#3b4d50" stroke="none" stroke-width="2"/><circle cx="49" cy="33" r="3" fill="#3b4d50" stroke="none" stroke-width="2"/><path d="M36 43H48" fill="none" stroke="#7d5a31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 30V40" fill="none" stroke="#7d5a31" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 30V40" fill="none" stroke="#7d5a31" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="45" font-size="30" fill="#503920" text-anchor="start" font-weight="650">黄铜机巧室 · 关门后还有路</text><path d="M336 97H568V269H336M336 97V130M336 222V274M336 310V335" fill="none" stroke="#aab3ae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M336 130C306 130 306 153 336 153C306 153 306 176 336 176C306 176 306 199 336 199C306 199 306 222 336 222" fill="none" stroke="#865b37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M336 310L365 280" fill="none" stroke="#566963" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="336" cy="274" r="5" fill="#fff" stroke="#566963" stroke-width="2"/><circle cx="336" cy="310" r="5" fill="#fff" stroke="#566963" stroke-width="2"/><path d="M549 183H587L568 151Z" fill="#fff9e9" stroke="#dc775d" stroke-width="4"/><path d="M546 147H590" fill="none" stroke="#dc775d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="615" y="153" font-size="27" fill="#ae5444" text-anchor="middle" font-weight="650">K</text><text x="615" y="192" font-size="27" fill="#ae5444" text-anchor="middle" font-weight="650">A</text><path d="M373 269H492" fill="none" stroke="#dc775d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coral)"/><path d="M568 244V205" fill="none" stroke="#dc775d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coral)"/><path d="M516 97H388" fill="none" stroke="#dc775d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coral)"/><path d="M336 109V125" fill="none" stroke="#dc775d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coral)"/><text x="230" y="183" font-size="32" fill="#865b37" text-anchor="middle" font-weight="650">线圈</text><text x="493" y="226" font-size="24" fill="#ae5444" text-anchor="middle" font-weight="650">外部二极管</text><text x="197" y="306" font-size="29" fill="#263b4e" text-anchor="middle" font-weight="650">MOS 断开</text><text x="134" y="117" font-size="24" fill="#ae5444" text-anchor="middle" font-weight="650">约定电流</text><text x="360" y="385" font-size="27" fill="#503920" text-anchor="middle" font-weight="650">续流绕过断口，仍沿原方向过线圈</text></g></svg>