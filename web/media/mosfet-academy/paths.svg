<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="黄铜机巧室 · 发令与供能"><defs><marker id="blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#317eb2"/></marker><marker id="purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9260ac"/></marker><marker id="coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc775d"/></marker><marker id="mint" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62d4ba"/></marker></defs><desc>功能示意。紫色控制线连接G；蓝色约定电流从电源正端经过负载、D、S回到电源负端。小引脚与S共地。G不是负载供电入口，机械向导仅作装饰。</desc><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="720" height="405" rx="20" fill="#efe4cc" stroke="none" stroke-width="2"/><rect x="16" y="66" width="688" height="286" rx="18" fill="#fff9e9" stroke="#ad8148" stroke-width="2"/><rect x="25" y="20" width="34" height="30" rx="6" fill="#d6aa61" stroke="#7d5a31" stroke-width="2"/><circle cx="35" cy="33" r="3" fill="#3b4d50" stroke="none" stroke-width="2"/><circle cx="49" cy="33" r="3" fill="#3b4d50" stroke="none" stroke-width="2"/><path d="M36 43H48" fill="none" stroke="#7d5a31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 30V40" fill="none" stroke="#7d5a31" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 30V40" fill="none" stroke="#7d5a31" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="45" font-size="30" fill="#503920" text-anchor="start" font-weight="650">黄铜机巧室 · 发令与供能</text><rect x="45" y="152" width="166" height="70" rx="12" fill="#eee1f2" stroke="#9260ac" stroke-width="2"/><text x="128" y="197" font-size="30" fill="#76508d" text-anchor="middle" font-weight="650">小引脚</text><path d="M483 130V98H629V148M629 244V326H483V289" fill="none" stroke="#317eb2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="629" cy="196" r="48" fill="#e5f1f2" stroke="#317eb2" stroke-width="3"/><text x="629" y="202" font-size="29" fill="#263b4e" text-anchor="middle" font-weight="650">电源</text><text x="629" y="151" font-size="24" fill="#263b4e" text-anchor="middle" font-weight="650">+</text><text x="629" y="258" font-size="24" fill="#263b4e" text-anchor="middle" font-weight="650">−</text><rect x="432" y="130" width="102" height="58" rx="9" fill="#d8e7f0" stroke="#317eb2" stroke-width="2"/><text x="483" y="169" font-size="29" fill="#263b4e" text-anchor="middle" font-weight="650">负载</text><path d="M483 188V226" fill="none" stroke="#317eb2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><rect x="432" y="235" width="102" height="54" rx="9" fill="#f2dbac" stroke="#a97e47" stroke-width="2"/><text x="483" y="272" font-size="28" fill="#263b4e" text-anchor="middle" font-weight="650">通道</text><path d="M211 187H326V262H415" fill="none" stroke="#9260ac" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purple)"/><text x="387" y="240" font-size="32" fill="#9260ac" text-anchor="middle" font-weight="650">G</text><text x="529" y="226" font-size="32" fill="#317eb2" text-anchor="middle" font-weight="650">D</text><text x="529" y="317" font-size="32" fill="#317eb2" text-anchor="middle" font-weight="650">S</text><path d="M128 222V326H483" fill="none" stroke="#778381" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M521 326H575" fill="none" stroke="#317eb2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><text x="154" y="280" font-size="26" fill="#9260ac" text-anchor="middle" font-weight="650">控制入口</text><text x="279" y="323" font-size="25" fill="#687573" text-anchor="middle" font-weight="650">共地</text><text x="360" y="385" font-size="27" fill="#503920" text-anchor="middle" font-weight="650">紫线发令；蓝线由外部电源供能</text></g></svg>