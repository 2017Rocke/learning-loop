<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>03 看到报警后，重新选分母</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#8b9b8e"/></marker></defs><rect width="960" height="540" rx="24" fill="#f7f6ef"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="45" y="65" font-size="37" fill="#233d34">03 看到报警后，重新选分母</text><text x="45" y="126" font-size="36" fill="#233d34">只看已经报警的 585 件</text><rect x="45" y="167" width="134" height="112" rx="18" fill="#c77554" stroke="none" stroke-width="3"/><rect x="186" y="167" width="729" height="112" rx="18" fill="#b4cdbd" stroke="none" stroke-width="3"/><text x="56" y="235" font-size="46" fill="#fff">90</text><text x="420" y="235" font-size="46" fill="#233d34">495</text><text x="45" y="325" font-size="29" fill="#b86b4e">真报警</text><text x="350" y="325" font-size="29" fill="#376b54">误报警</text><text x="45" y="405" font-size="48" fill="#233d34">90 ÷（90 + 495）≈ 15.4%</text><text x="45" y="474" font-size="31" fill="#233d34">分母是所有报警件，不是所有坏件。</text><text x="45" y="513" font-size="27" fill="#708278">P（坏 | 报警）≠ P（报警 | 坏）</text></g></svg>