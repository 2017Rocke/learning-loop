<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>04 换一个群体，结论也会变</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#8b9b8e"/></marker></defs><rect width="960" height="540" rx="24" fill="#f7f6ef"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="45" y="65" font-size="37" fill="#233d34">04 换一个群体，结论也会变</text><text x="45" y="123" font-size="29" fill="#233d34">同一报警器：检出率 90%，误报率 5%</text><text x="45" y="180" font-size="32" fill="#233d34">坏件率 1%</text><rect x="45" y="199" width="134" height="71" rx="18" fill="#c77554" stroke="none" stroke-width="3"/><rect x="186" y="199" width="729" height="71" rx="18" fill="#dce8df" stroke="none" stroke-width="3"/><text x="213" y="245" font-size="31" fill="#233d34">90 真 + 495 假 → 15.4%</text><text x="45" y="334" font-size="32" fill="#233d34">坏件率 10%</text><rect x="45" y="352" width="575" height="71" rx="18" fill="#c77554" stroke="none" stroke-width="3"/><rect x="627" y="352" width="288" height="71" rx="18" fill="#dce8df" stroke="none" stroke-width="3"/><text x="76" y="398" font-size="33" fill="#fff">900 真 + 450 假 → 66.7%</text><text x="45" y="487" font-size="28" fill="#233d34">证据的方向相同，起点不同，更新后的概率不同。</text><text x="45" y="522" font-size="23" fill="#708278">条形长度表示各自报警群体中的真 / 假比例。</text></g></svg>