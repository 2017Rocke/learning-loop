<title id="title">先看原本比例</title><desc id="desc">薄荷机器人陪伴两类产品角色观察一百颗计数点，每颗点代表一百件产品。一颗珊瑚橙色叉号点代表一百坏件，九十九颗蓝点代表九千九百正常件，共一万件，坏件率百分之一。两旁橙色叉号和蓝色对号的产品角色只代表类别，不额外计数。此时尚未使用本次报警。</desc>
