<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>01 先问：原本有多少坏件？</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#8b9b8e"/></marker></defs><rect width="960" height="540" rx="24" fill="#f7f6ef"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="45" y="65" font-size="37" fill="#233d34">01 先问：原本有多少坏件？</text><text x="45" y="117" font-size="29" fill="#233d34">假设一批 10,000 件，坏件率为 1%</text><rect x="45" y="155" width="275" height="240" rx="18" fill="#f1ded4" stroke="none" stroke-width="3"/><rect x="342" y="155" width="573" height="240" rx="18" fill="#deeadf" stroke="none" stroke-width="3"/><text x="73" y="222" font-size="32" fill="#b86b4e">坏件</text><text x="73" y="305" font-size="63" fill="#b86b4e">100 件</text><text x="373" y="222" font-size="32" fill="#376b54">正常件</text><text x="373" y="305" font-size="63" fill="#376b54">9,900 件</text><text x="45" y="457" font-size="30" fill="#233d34">检出率相同，群体比例不同，报警的含义也会变。</text><text x="45" y="505" font-size="23" fill="#708278">示意卡片不按人数面积比例绘制；数字为教学假设。</text></g></svg>