<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img"><title>02 报警声从哪里来？</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3 Z" fill="#8b9b8e"/></marker></defs><rect width="960" height="540" rx="24" fill="#f7f6ef"/><g font-family="system-ui, PingFang SC, sans-serif"><text x="45" y="65" font-size="37" fill="#233d34">02 报警声从哪里来？</text><rect x="315" y="112" width="330" height="75" rx="18" fill="#e5e9dc" stroke="none" stroke-width="3"/><text x="369" y="162" font-size="41" fill="#233d34">10,000 件</text><path d="M370 190 L226 237" fill="none" stroke="#8b9b8e" stroke-width="4" marker-end="url(#arrow)"/><path d="M590 190 L726 237" fill="none" stroke="#8b9b8e" stroke-width="4" marker-end="url(#arrow)"/><rect x="45" y="250" width="395" height="190" rx="18" fill="#f1ded4" stroke="none" stroke-width="3"/><rect x="520" y="250" width="395" height="190" rx="18" fill="#deeadf" stroke="none" stroke-width="3"/><text x="72" y="300" font-size="34" fill="#b86b4e">100 坏件 × 90%</text><text x="72" y="365" font-size="43" fill="#b86b4e">90 件真报警</text><text x="72" y="413" font-size="25" fill="#233d34">另有 10 件漏报</text><text x="548" y="300" font-size="32" fill="#376b54">9,900 正常 × 5%</text><text x="548" y="365" font-size="43" fill="#376b54">495 件误报警</text><text x="548" y="413" font-size="25" fill="#233d34">另有 9,405 件未报警</text><text x="45" y="500" font-size="31" fill="#233d34">报警来自两条路径：真报警 + 误报警。</text></g></svg>