<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">04 能播放，还要读对、读全</title>
<desc id="desc">同一文字以两种停顿方式呈现：A的示意波形连续，B在句末留出停顿。右侧三个独立验收框分别检查能否发声、术语是否读对、内容是否完整；框没有预先勾选，实际结果仍需试听验证。</desc>
