<text x="42" y="474" font-size="29" fill="#1F2329" font-weight="500" text-anchor="start">改变停顿会改变听感；能发声不等于验收通过。</text>
<text x="42" y="518" font-size="18" fill="#60676F" font-weight="400" text-anchor="start">原创教学对照 · 非真实波形，不表示某种停顿总会更好</text>
