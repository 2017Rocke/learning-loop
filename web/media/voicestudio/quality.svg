<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
<title id="title">完整性、术语与接缝分别检查</title><desc id="desc">三个圆润场景表示不同的试听职责。左侧蓝色原稿与一二三编号的音频位置相对照，用来检查内容完整性；中间薄荷机器人戴着耳机查看词语卡，用来检查术语读音；右侧放大镜观察珊瑚色和蓝色音频相接的位置，用来检查接缝听感。三个场景都没有预填通过标记，也没有展示任何甲乙版本的对比结果。人物和波形均为原创示意。</desc><defs>
