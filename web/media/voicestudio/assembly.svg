<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
<title id="title">已有声音在短重叠内相加</title><desc id="desc">上方珊瑚色波形表示前段尾部，权重从强到弱；下方蓝色波形表示后段头部，权重从弱到强。两者在同一重叠区按权重相加，得到右侧紫色示意波形。这里画的是已有样本的线性交叉淡化。源码默认设置五十毫秒重叠，实际长度还受可用样本数限制。图中没有展示某段生成为空时的结果；所有波形都是原创教学示意。</desc><defs>
<linearGradient id="bad" x2="0.3" y2="1"><stop stop-color="#FFB29B"/><stop offset="1" stop-color="#EF836E"/></linearGradient>
<linearGradient id="good" x2="0.3" y2="1"><stop stop-color="#A2D8FF"/><stop offset="1" stop-color="#67ADE6"/></linearGradient>
<linearGradient id="mint" x2="0.3" y2="1"><stop stop-color="#CFF4DD"/><stop offset="1" stop-color="#8BCFB6"/></linearGradient>
<linearGradient id="bell" x2="0.3" y2="1"><stop stop-color="#D2BBF9"/><stop offset="1" stop-color="#A183D8"/></linearGradient>
