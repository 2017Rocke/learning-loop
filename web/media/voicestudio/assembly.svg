<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">03 用交叉淡化连接两段声音</title><desc id="desc">两段相邻音频在重叠区对齐：第一段尾部的权重线性减小，第二段头部的权重线性增大，再把两者加权相加。源码默认重叠50毫秒，可以调整；这不是额外插入静音，也不能补回失败或缺失的句子。发现失败段应先核验和修复，是制作建议，并非自动重试功能。</desc>
