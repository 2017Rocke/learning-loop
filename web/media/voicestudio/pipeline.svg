<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
<title id="title">工作台与语音模型怎样分工</title><desc id="desc">薄荷色小机器人代表组织生成与编辑流程的工作台。工作台内，蓝色文字卡和音色配置送入紫色的已有语音模型，模型输出带一、二编号的音频段。底部由工作台整理声音。机器人与模型是职责类比，不代表软件真实外观；波形是示意，没有比较不同引擎的结果。</desc><defs>
