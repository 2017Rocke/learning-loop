<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
<title id="title">预算窗口中的候选边界</title><desc id="desc">上方示意文字是“先检查。再导出。”，绿色区域表示一次有限字符预算，粉色圈标出预算内的一个句末候选点，橙色虚线表示窗口边界。下方另一段连续文字没有标点，也没有空格，旁边的问号邀请学员预测断点。图中不显示这个情境的处理结果；窗口长度仅为教学示意，不是源码默认值，也不保证块内词义完整。</desc><defs>
<linearGradient id="bad" x2="0.3" y2="1"><stop stop-color="#FFB29B"/><stop offset="1" stop-color="#EF836E"/></linearGradient>
<linearGradient id="good" x2="0.3" y2="1"><stop stop-color="#A2D8FF"/><stop offset="1" stop-color="#67ADE6"/></linearGradient>
<linearGradient id="mint" x2="0.3" y2="1"><stop stop-color="#CFF4DD"/><stop offset="1" stop-color="#8BCFB6"/></linearGradient>
<linearGradient id="bell" x2="0.3" y2="1"><stop stop-color="#D2BBF9"/><stop offset="1" stop-color="#A183D8"/></linearGradient>
<marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8F79B0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="720" height="405" rx="30" fill="#FFF8EE"/><path d="M0 76Q69 51 119 91T189 122Q100 152 0 131Z" fill="#FFF0DF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M720 211Q660 183 639 225T662 326Q703 352 720 311Z" fill="#FBE9F0" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M676 27Q678 34 685 36Q678 38 676 45Q674 38 667 36Q674 34 676 27" fill="#E6B653" stroke="#E6B653" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M38 308Q40 314 46 316Q40 318 38 324Q36 318 30 316Q36 314 38 308" fill="#B9DCCD" stroke="#B9DCCD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="672" cy="354" r="6" fill="#DCCDF1" stroke="none" stroke-width="1"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="365" y="46" font-size="38" fill="#37304B" font-weight="650" text-anchor="middle">先圈预算，再找候选边界</text><path d="M97 99Q349 82 627 105L625 194Q359 218 91 191Z" fill="#EDF7FE" stroke="#C3D8EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M121 120H450V191H121Z" fill="#E5F5E8" stroke="#C0DCCC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="153" y="167" font-size="37" fill="#245F94" font-weight="600" text-anchor="middle">先</text><text x="208" y="167" font-size="37" fill="#245F94" font-weight="600" text-anchor="middle">检</text><text x="263" y="167" font-size="37" fill="#245F94" font-weight="600" text-anchor="middle">查</text><circle cx="318" cy="154" r="23" fill="#F8D5E2" stroke="none" stroke-width="1"/><text x="318" y="167" font-size="37" fill="#245F94" font-weight="600" text-anchor="middle">。</text><text x="373" y="167" font-size="37" fill="#245F94" font-weight="600" text-anchor="middle">再</text><text x="428" y="167" font-size="37" fill="#245F94" font-weight="600" text-anchor="middle">导</text><text x="483" y="167" font-size="37" fill="#245F94" font-weight="600" text-anchor="middle">出</text><text x="538" y="167" font-size="37" fill="#245F94" font-weight="600" text-anchor="middle">。</text><path d="M451 92V207" fill="none" stroke="#B37037" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><text x="271" y="103" font-size="30" fill="#347665" font-weight="600" text-anchor="middle">预算窗口</text><path d="M318 193V216" fill="none" stroke="#61459E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="318" y="251" font-size="34" fill="#61459E" font-weight="650" text-anchor="middle">句末候选</text><g transform="translate(74 292) scale(0.43)"><ellipse cx="0" cy="82" rx="50" ry="9" fill="#E6DDD0"/><path d="M-21 37Q-39 73-14 80H20Q43 69 21 38" fill="url(#mint)" stroke="#347665" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-27 55Q-48 43-49 27M27 55Q46 39 52 20" fill="none" stroke="#347665" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="-17" cy="79" rx="14" ry="8" fill="#65BDA0"/><ellipse cx="18" cy="79" rx="14" ry="8" fill="#65BDA0"/><path d="M0-34V-47" fill="none" stroke="#347665" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -65Q2 -57 10 -55Q2 -53 0 -45Q-2 -53 -10 -55Q-2 -57 0 -65" fill="#E8B856" stroke="#E8B856" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M-49-6Q-48-35-13-35H16Q49-35 50-6L47 25Q44 45 17 44H-17Q-45 45-49 25Z" fill="url(#mint)" stroke="#347665" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-33-6Q-28-21-9-19H17Q34-20 35-4L34 18Q29 30 11 29H-13Q-32 28-34 16Z" fill="#FFFDF8" stroke="#D0F2E5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="-15" cy="2" rx="5" ry="7" fill="#37304B"/><ellipse cx="16" cy="2" rx="5" ry="7" fill="#37304B"/><ellipse cx="-26" cy="14" rx="7" ry="4" fill="#F4AEC8"/><ellipse cx="27" cy="14" rx="7" ry="4" fill="#F4AEC8"/><path d="M-5 17Q1 24 8 16" fill="none" stroke="#37304B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-20 42Q0 53 21 42L28 55Q1 66-27 53Z" fill="#B99CDD" stroke="#8B6BC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M125 276Q342 257 543 279L543 338Q334 359 121 335Z" fill="#EDF7FE" stroke="#C3D8EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="335" y="318" font-size="34" fill="#245F94" font-weight="600" text-anchor="middle">连续长文没有标点</text><text x="608" y="304" font-size="64" fill="#61459E" font-weight="700" text-anchor="middle">?</text><text x="607" y="351" font-size="30" fill="#61459E" font-weight="600" text-anchor="middle">断点呢</text>
<text x="360" y="394" font-size="19" fill="#746A81" font-weight="500" text-anchor="middle">教学示意 · 窗口长度不是默认预算；先预测再核对</text>
</g></svg>
