 </g><text x="91" y="48" font-size="33" fill="#FFF4DB" text-anchor="start" font-weight="650">② 需求突增，就近补电</text><rect x="34" y="142" width="118" height="150" rx="20" fill="#dceefc" stroke="none" stroke-width="0" /><text x="93" y="194" font-size="32" fill="#24324C" text-anchor="middle" font-weight="600">电源</text><text x="93" y="250" font-size="29" fill="#24324C" text-anchor="middle" font-weight="600">＋  −</text><path d="M152 169 H535 M152 280 H535" stroke="#8ea5b4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M222 169 l8 -12 14 24 14 -24 14 24 8 -12" stroke="#8ea5b4" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="246" y="128" font-size="28" fill="#24324C" text-anchor="middle" font-weight="600">线路阻抗</text><rect x="526" y="145" width="150" height="156" rx="18" fill="#ffe3d3" stroke="#BF514A" stroke-width="4" /><text x="601" y="197" font-size="34" fill="#24324C" text-anchor="middle" font-weight="600">芯片</text><text x="601" y="270" font-size="28" fill="#24324C" text-anchor="middle" font-weight="600">忙起来</text><path d="M387 169 V213 M387 239 V280" stroke="#7352A0" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M361 213 H413 M361 239 H413" stroke="#7352A0" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="387" y="330" font-size="30" fill="#7352A0" text-anchor="middle" font-weight="600">电容</text><path d="M405 169 H514" stroke="#287858" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)" /><path d="M509 280 H404" stroke="#287858" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)" /><text x="455" y="115" font-size="30" fill="#287858" text-anchor="middle" font-weight="600">暂时补给</text><text x="478" y="345" font-size="29" fill="#287858" text-anchor="start" font-weight="600">完整返回</text><path d="M548 226 H565 V213 H6