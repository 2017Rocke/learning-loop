<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="② 需求突增，就近补电" aria-describedby="star-workshop-description"><defs><marker id="green-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#287858" /></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7352A0" /></marker><linearGradient id="workshop-night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17233F" /><stop offset="1" stop-color="#24324C" /></linearGradient><linearGradient id="workshop-paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF4DB" /><stop offset="1" stop-color="#f5e7c8" /></linearGradient></defs><desc id="star-workshop-description">原创「星灯工坊」外观：深靛蓝星空边框、黄铜色圆拱书架和悬浮笔记环绕暖羊皮纸课堂；左上角为薄荷色切面晶体灯灵，带悬浮铜环和简洁表情。装饰不表示电路机制。电源经两条线路连接芯片，附近紫色电容并联在电源与地之间。绿色箭头从电容上端流向芯片，再从芯片地脚返回电容下端，表示短时补给的完整外部回路；芯片阶跃符号表示需求突增。</desc><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><g id="star-workshop-frame" aria-hidden="true">
