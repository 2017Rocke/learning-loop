<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">同一电路的关断和导通状态</title><desc id="desc">左右为同一个增强型 N 沟道 MOS 低端开关的功能示意，假设正确驱动且负载是额定 5 V 的非感性小灯模块。左侧关断时 D 到 S 的通路断开，无闭合负载电流；右侧导通时绿色约定电流从电源正端经灯、D、S 回负端。紫色 G 箭头表示控制关系，不是灯的工作电流。功能开关符号不是 MOS 实际内部结构；省略正常反向偏置的体二极管与驱动细节。</desc><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect width="960" height="540" rx="24" fill="#efe4cc"/><rect x="18" y="86" width="924" height="356" rx="20" fill="#fff9e9" stroke="#c7ad7d" stroke-width="2"/><path d="M27 38H42M35 30V46M922 38H936M929 31V45" fill="none" stroke="#925e22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="57" font-size="42" fill="#243c38" text-anchor="middle" font-weight="650">电流走 D → S；G 只控制</text><rect x="38" y="102" width="430" height="326" rx="18" fill="#f4ecdc" stroke="#cbb995" stroke-width="2"/><text x="253" y="145" font-size="35" fill="#243c38" text-anchor="middle" font-weight="650">关：回路断开</text><path d="M110 241V184H338V215M338 275V296M338 364V397H110V329" fill="none" stroke="#08765e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="74" y="241" width="72" height="88" rx="12" fill="#e2e9df" stroke="#08765e" stroke-width="3"/><text x="110" y="297" font-size="29" fill="#243c38" text-anchor="middle" font-weight="650">5V</text><text x="72" y="226" font-size="32" fill="#243c38" text-anchor="middle" font-weight="650">+</text><text x="72" y="358" font-size="32" fill="#243c38" text-anchor="middle" font-weight="650">−</text><circle cx="338" cy="245" r="30" fill="#deded2" stroke="#08765e" stroke-width="4"/><path d="M322 229L354 261M354 229L322 261" fill="none" stroke="#08765e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="397" y="257" font-size="34" fill="#243c38" text-anchor="middle" font-weight="650">灯</text><circle cx="338" cy="300" r="5" fill="#08765e" stroke="none" stroke-width="3"/><circle cx="338" cy="360" r="5" fill="#08765e" stroke="none" stroke-width="3"/><path d="M338 360L305 314" fill="none" stroke="#08765e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="387" y="310" font-size="34" fill="#08765e" text-anchor="middle" font-weight="650">D</text><text x="387" y="371" font-size="34" fill="#08765e" text-anchor="middle" font-weight="650">S</text><path d="M195 332L282 332" fill="none" stroke="#8051a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M266.0 340.0L282 332L266.0 324.0" fill="none" stroke="#8051a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="183" y="318" font-size="34" fill="#8051a0" text-anchor="middle" font-weight="650">G</text><rect x="492" y="102" width="430" height="326" rx="18" fill="#edf5e8" stroke="#b1c5ab" stroke-width="2"/><text x="707" y="145" font-size="35" fill="#08765e" text-anchor="middle" font-weight="650">开：回路接通</text><path d="M564 241V184H792V215M792 275V296M792 364V397H564V329" fill="none" stroke="#08765e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="528" y="241" width="72" height="88" rx="12" fill="#e2e9df" stroke="#08765e" stroke-width="3"/><text x="564" y="297" font-size="29" fill="#243c38" text-anchor="middle" font-weight="650">5V</text><text x="526" y="226" font-size="32" fill="#243c38" text-anchor="middle" font-weight="650">+</text><text x="526" y="358" font-size="32" fill="#243c38" text-anchor="middle" font-weight="650">−</text><circle cx="792" cy="245" r="30" fill="#ffdf76" stroke="#08765e" stroke-width="4"/><path d="M776 229L808 261M808 229L776 261" fill="none" stroke="#08765e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="851" y="257" font-size="34" fill="#243c38" text-anchor="middle" font-weight="650">灯</text><circle cx="792" cy="300" r="5" fill="#08765e" stroke="none" stroke-width="3"/><circle cx="792" cy="360" r="5" fill="#08765e" stroke="none" stroke-width="3"/><path d="M792 360L792 302" fill="none" stroke="#08765e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="841" y="310" font-size="34" fill="#08765e" text-anchor="middle" font-weight="650">D</text><text x="841" y="371" font-size="34" fill="#08765e" text-anchor="middle" font-weight="650">S</text><path d="M649 332L736 332" fill="none" stroke="#8051a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M720.0 340.0L736 332L720.0 324.0" fill="none" stroke="#8051a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="637" y="318" font-size="34" fill="#8051a0" text-anchor="middle" font-weight="650">G</text><path d="M653 184L705 184" fill="none" stroke="#08765e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M689.0 192.0L705 184L689.0 176.0" fill="none" stroke="#08765e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M792 278L792 293" fill="none" stroke="#08765e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M784.0 277.0L792 293L800.0 277.0" fill="none" stroke="#08765e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M712 397L660 397" fill="none" stroke="#08765e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M676.0 389.0L660 397L676.0 405.0" fill="none" stroke="#08765e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="500" font-size="35" fill="#925e22" text-anchor="middle" font-weight="650">约定电流：电源＋ → 灯 → D → S → 电源−</text></g></svg>
