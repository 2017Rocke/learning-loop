<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">主动拉低和断开控制线不是一回事</title><desc id="desc">两侧均为栅极等效电容示意，不是真实内部剖面。紫色左极板表示 G，黄色竖条表示栅绝缘层。左侧把 G 主动连到共同地，经外部导线释放栅电荷，使 G 对 S 回到零伏而关断。右侧断开控制线后 G 悬空，栅电荷可能残留，因此不能把断线当作可靠关断。加号仅表示可能残留的净正电荷，不是运动的电子。紫色箭头只表示 G 端栅电荷沿外部控制线释放，未穿过绝缘层；不表示灯的负载电流。</desc><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect width="960" height="540" rx="24" fill="#efe4cc"/><rect x="18" y="86" width="924" height="356" rx="20" fill="#fff9e9" stroke="#c7ad7d" stroke-width="2"/><path d="M27 38H42M35 30V46M922 38H936M929 31V45" fill="none" stroke="#925e22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="57" font-size="42" fill="#243c38" text-anchor="middle" font-weight="650">关断要拉低，不能把 G 悬空</text><rect x="38" y="103" width="430" height="324" rx="18" fill="#e5f0e2" stroke="#99b69b" stroke-width="2"/><text x="253" y="147" font-size="34" fill="#8051a0" text-anchor="middle" font-weight="650">拉到 0 V：关断</text><text x="298" y="207" font-size="37" fill="#8051a0" text-anchor="middle" font-weight="650">G</text><path d="M298 218V321" fill="none" stroke="#8051a0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><rect x="326" y="205" width="22" height="130" rx="3" fill="#f1d092" stroke="#925e22" stroke-width="2"/><path d="M371 218V321" fill="none" stroke="#778a77" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><text x="344" y="381" font-size="31" fill="#925e22" text-anchor="middle" font-weight="650">绝缘层</text><path d="M298 271H133V343" fill="none" stroke="#8051a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M263 271L203 271" fill="none" stroke="#8051a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M219.0 263.0L203 271L219.0 279.0" fill="none" stroke="#8051a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M133 300L133 339" fill="none" stroke="#8051a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M125.0 323.0L133 339L141.0 323.0" fill="none" stroke="#8051a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M111 347H155M119 359H147M127 371H139" fill="none" stroke="#8051a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="198" y="243" font-size="30" fill="#8051a0" text-anchor="middle" font-weight="650">沿外线释放</text><text x="133" y="406" font-size="29" fill="#8051a0" text-anchor="middle" font-weight="650">共同地</text><rect x="492" y="103" width="430" height="324" rx="18" fill="#f6eade" stroke="#c9aa90" stroke-width="2"/><text x="707" y="147" font-size="34" fill="#ad463d" text-anchor="middle" font-weight="650">悬空：状态不可靠</text><text x="752" y="207" font-size="37" fill="#8051a0" text-anchor="middle" font-weight="650">G</text><path d="M752 218V321" fill="none" stroke="#8051a0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><rect x="780" y="205" width="22" height="130" rx="3" fill="#f1d092" stroke="#925e22" stroke-width="2"/><path d="M825 218V321" fill="none" stroke="#778a77" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><text x="798" y="381" font-size="31" fill="#925e22" text-anchor="middle" font-weight="650">绝缘层</text><path d="M565 271H614M666 271H752" fill="none" stroke="#8051a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="638" y="252" font-size="29" fill="#ad463d" text-anchor="middle" font-weight="650">断线</text><text x="730" y="247" font-size="28" fill="#8051a0" text-anchor="middle" font-weight="650">+</text><text x="730" y="284" font-size="28" fill="#8051a0" text-anchor="middle" font-weight="650">+</text><text x="667" y="406" font-size="31" fill="#ad463d" text-anchor="middle" font-weight="650">电荷可能留住</text><text x="480" y="500" font-size="35" fill="#925e22" text-anchor="middle" font-weight="650">栅电荷走外部导线，不穿过绝缘层</text></g></svg>
