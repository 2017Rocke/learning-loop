<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">先认 MOS 管的外形</title><desc id="desc">左侧为类似 TO-220 的三脚封装，右侧为小型贴片封装的功能外观示意。图中没有指定 G、D、S 的物理引脚顺序。相似外形也可能是其他器件，必须根据型号查数据手册确认。</desc><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect width="960" height="540" rx="24" fill="#efe4cc"/><rect x="18" y="86" width="924" height="356" rx="20" fill="#fff9e9" stroke="#c7ad7d" stroke-width="2"/><path d="M27 38H42M35 30V46M922 38H936M929 31V45" fill="none" stroke="#925e22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="57" font-size="42" fill="#243c38" text-anchor="middle" font-weight="650">MOS 管长什么样？</text><text x="264" y="140" font-size="39" fill="#243c38" text-anchor="middle" font-weight="650">三脚封装</text><text x="707" y="140" font-size="39" fill="#243c38" text-anchor="middle" font-weight="650">小型贴片</text><rect x="192" y="163" width="144" height="134" rx="12" fill="#52615d" stroke="#243c38" stroke-width="4"/><rect x="218" y="158" width="92" height="62" rx="8" fill="#bdc8bd" stroke="#243c38" stroke-width="3"/><circle cx="264" cy="185" r="12" fill="#fff9e9" stroke="#69766e" stroke-width="3"/><rect x="192" y="219" width="144" height="88" rx="8" fill="#2b423d" stroke="none" stroke-width="3"/><path d="M219 308V365" fill="none" stroke="#758680" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><path d="M264 308V365" fill="none" stroke="#758680" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><path d="M309 308V365" fill="none" stroke="#758680" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><text x="264" y="412" font-size="34" fill="#243c38" text-anchor="middle" font-weight="650">引脚可伸出外壳</text><path d="M600 206L741 174L821 220L679 254Z" fill="#344e46" stroke="#233c35" stroke-width="4"/><path d="M600 206V287L679 338V254ZM679 254L821 220V299L679 338Z" fill="#263f37" stroke="#233c35" stroke-width="4"/><path d="M616 286L633 281V298L616 303Z" fill="#d8bf86" stroke="#927340" stroke-width="2"/><path d="M642 302L659 297V314L642 319Z" fill="#d8bf86" stroke="#927340" stroke-width="2"/><path d="M668 318L685 313V330L668 335Z" fill="#d8bf86" stroke="#927340" stroke-width="2"/><path d="M703 322L720 317V334L703 339Z" fill="#d8bf86" stroke="#927340" stroke-width="2"/><path d="M745 310L762 305V322L745 327Z" fill="#d8bf86" stroke="#927340" stroke-width="2"/><path d="M787 299L804 294V311L787 316Z" fill="#d8bf86" stroke="#927340" stroke-width="2"/><text x="707" y="412" font-size="34" fill="#243c38" text-anchor="middle" font-weight="650">焊盘也可能在底部</text><text x="480" y="500" font-size="35" fill="#925e22" text-anchor="middle" font-weight="650">认型号、查手册；不能只看外形</text></g></svg>
