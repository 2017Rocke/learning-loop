<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">先用水阀类比理解栅极控制</title><desc id="desc">左侧水阀手柄控制水路只是类比，不代表 MOS 内部有机械阀。右侧为增强型 N 沟道 MOS 低端开关：S 接共同地，控制取决于 G 相对 S 的电压。G 对 S 为零伏时关断；按器件手册和负载条件提供合适栅压才能充分导通。达到阈值不等于完全打开。</desc><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect width="960" height="540" rx="24" fill="#efe4cc"/><rect x="18" y="86" width="924" height="356" rx="20" fill="#fff9e9" stroke="#c7ad7d" stroke-width="2"/><path d="M27 38H42M35 30V46M922 38H936M929 31V45" fill="none" stroke="#925e22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="57" font-size="42" fill="#243c38" text-anchor="middle" font-weight="650">栅极 G，像水阀的手柄</text><text x="245" y="136" font-size="37" fill="#8051a0" text-anchor="middle" font-weight="650">水阀类比</text><path d="M92 283H368" fill="none" stroke="#a0c4b1" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" /><path d="M92 283H368" fill="none" stroke="#d5eee2" stroke-width="39" stroke-linecap="round" stroke-linejoin="round" /><rect x="192" y="233" width="100" height="103" rx="15" fill="#d8b66f" stroke="#925e22" stroke-width="5"/><path d="M242 233V195M188 189H296" fill="none" stroke="#8051a0" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" /><path d="M106 283L167 283" fill="none" stroke="#08765e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M151.0 291.0L167 283L151.0 275.0" fill="none" stroke="#08765e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M307 283L365 283" fill="none" stroke="#08765e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M349.0 291.0L365 283L349.0 275.0" fill="none" stroke="#08765e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="245" y="388" font-size="35" fill="#243c38" text-anchor="middle" font-weight="650">手柄控制水路</text><path d="M454 112V415" fill="none" stroke="#d5c7a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 10"/><text x="696" y="136" font-size="35" fill="#8051a0" text-anchor="middle" font-weight="650">真实电路：看 G 对 S</text><rect x="492" y="173" width="400" height="92" rx="16" fill="#e8ede2" stroke="#b0bba9" stroke-width="2"/><text x="575" y="228" font-size="39" fill="#243c38" text-anchor="middle" font-weight="650">0 V</text><path d="M641 218L704 218" fill="none" stroke="#8051a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M688.0 226.0L704 218L688.0 210.0" fill="none" stroke="#8051a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="229" font-size="43" fill="#243c38" text-anchor="middle" font-weight="650">关</text><rect x="492" y="287" width="400" height="92" rx="16" fill="#d3eee0" stroke="#68a78b" stroke-width="2"/><text x="583" y="341" font-size="35" fill="#243c38" text-anchor="middle" font-weight="650">合适栅压</text><path d="M679 332L726 332" fill="none" stroke="#8051a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M710.0 340.0L726 332L710.0 324.0" fill="none" stroke="#8051a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="800" y="343" font-size="43" fill="#243c38" text-anchor="middle" font-weight="650">开</text><text x="696" y="421" font-size="33" fill="#243c38" text-anchor="middle" font-weight="650">本例 S 接共同地</text><text x="480" y="500" font-size="35" fill="#925e22" text-anchor="middle" font-weight="650">类比不是内部结构；具体栅压查手册</text></g></svg>
