<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">控制信号和供电是两件事</title><desc id="desc">教学假设：合适的增强型 N 沟道 MOS 低端开关，连接额定 5 V 的非感性小灯模块。绿色约定电流由电源正端经过小灯、MOS 的 D 和 S 回到负端。控制器通过紫色 G 线发信号，并与 S 共地；灯的工作电流不由控制器的 G 线提供。为突出功能省略驱动电阻和保护细节。</desc><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect width="960" height="540" rx="24" fill="#efe4cc"/><rect x="18" y="86" width="924" height="356" rx="20" fill="#fff9e9" stroke="#c7ad7d" stroke-width="2"/><path d="M27 38H42M35 30V46M922 38H936M929 31V45" fill="none" stroke="#925e22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="57" font-size="42" fill="#243c38" text-anchor="middle" font-weight="650">谁发信号，谁给小灯供电？</text><rect x="61" y="205" width="230" height="98" rx="18" fill="#eee1f3" stroke="#8051a0" stroke-width="3"/><text x="176" y="265" font-size="42" fill="#8051a0" text-anchor="middle" font-weight="650">控制器</text><rect x="424" y="272" width="203" height="96" rx="18" fill="#f5dfab" stroke="#925e22" stroke-width="3"/><text x="525" y="331" font-size="37" fill="#925e22" text-anchor="middle" font-weight="650">MOS 开关</text><rect x="424" y="115" width="203" height="90" rx="18" fill="#fff0ae" stroke="#925e22" stroke-width="3"/><text x="525" y="170" font-size="37" fill="#243c38" text-anchor="middle" font-weight="650">小灯模块</text><rect x="740" y="174" width="153" height="135" rx="18" fill="#e6ede4" stroke="#925e22" stroke-width="3"/><text x="816" y="225" font-size="43" fill="#243c38" text-anchor="middle" font-weight="650">5 V</text><text x="816" y="278" font-size="38" fill="#243c38" text-anchor="middle" font-weight="650">电源</text><path d="M816 174V148H627M525 205V272M525 368V410H816V309" fill="none" stroke="#08765e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M718 148L666 148" fill="none" stroke="#08765e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M682.0 140.0L666 148L682.0 156.0" fill="none" stroke="#08765e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M525 214L525 259" fill="none" stroke="#08765e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M517.0 243.0L525 259L533.0 243.0" fill="none" stroke="#08765e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M688 410L738 410" fill="none" stroke="#08765e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M722.0 418.0L738 410L722.0 402.0" fill="none" stroke="#08765e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="854" y="155" font-size="39" fill="#08765e" text-anchor="middle" font-weight="650">+</text><text x="854" y="348" font-size="39" fill="#08765e" text-anchor="middle" font-weight="650">−</text><path d="M291 254L405 309" fill="none" stroke="#8051a0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M387.11324277880715 309.25281635648327L405 309L394.06569258209765 294.8422840369357" fill="none" stroke="#8051a0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="338" y="216" font-size="36" fill="#8051a0" text-anchor="middle" font-weight="650">控制</text><text x="370" y="339" font-size="38" fill="#8051a0" text-anchor="middle" font-weight="650">G</text><path d="M176 303V410H525" fill="none" stroke="#71867b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="275" y="397" font-size="32" fill="#4e655a" text-anchor="middle" font-weight="650">共同地</text><text x="661" y="259" font-size="35" fill="#08765e" text-anchor="middle" font-weight="650">D</text><text x="661" y="375" font-size="35" fill="#08765e" text-anchor="middle" font-weight="650">S</text><text x="480" y="500" font-size="35" fill="#925e22" text-anchor="middle" font-weight="650">控制器发信号；外部电源供能</text></g></svg>
