<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="星灯工坊 · 为什么停下来了"><defs><marker id="blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#317eb2"/></marker><marker id="purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9260ac"/></marker><marker id="coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc775d"/></marker><marker id="mint" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62d4ba"/></marker></defs><desc>合成理想稳定状态：电源与电容都是3.3伏，二者电压差为零，充电电流为零，但电容仍有分开的电荷与电场。两个条长度仅对照本例相等电压。</desc><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="720" height="405" rx="20" fill="#182a42" stroke="none" stroke-width="2"/><rect x="16" y="66" width="688" height="286" rx="18" fill="#f7f2de" stroke="#bc9c5c" stroke-width="2"/><path d="M29 25L42 17L55 25V47L42 55L29 47Z" fill="#62d4ba" stroke="#d4b676" stroke-width="2"/><path d="M34 36H50" fill="none" stroke="#38505e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="33" r="2" fill="#23394a" stroke="none" stroke-width="2"/><circle cx="47" cy="33" r="2" fill="#23394a" stroke="none" stroke-width="2"/><text x="76" y="45" font-size="30" fill="#fff6dc" text-anchor="start" font-weight="650">星灯工坊 · 为什么停下来了</text><text x="190" y="115" font-size="28" fill="#263b4e" text-anchor="middle" font-weight="650">电源电压</text><rect x="63" y="137" width="255" height="28" rx="8" fill="#e5dabc" stroke="none" stroke-width="2"/><rect x="63" y="137" width="255" height="28" rx="8" fill="#7da9a0" stroke="none" stroke-width="2"/><text x="190" y="203" font-size="38" fill="#263b4e" text-anchor="middle" font-weight="650">3.3 V</text><text x="190" y="243" font-size="28" fill="#263b4e" text-anchor="middle" font-weight="650">电容电压</text><rect x="63" y="264" width="255" height="28" rx="8" fill="#e5dabc" stroke="none" stroke-width="2"/><rect x="63" y="264" width="255" height="28" rx="8" fill="#d3b363" stroke="none" stroke-width="2"/><text x="190" y="331" font-size="38" fill="#263b4e" text-anchor="middle" font-weight="650">3.3 V</text><path d="M354 140V283" fill="none" stroke="#bca986" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="526" y="149" font-size="31" fill="#263b4e" text-anchor="middle" font-weight="650">推动差 ≈ 0 V</text><text x="526" y="219" font-size="32" fill="#263b4e" text-anchor="middle" font-weight="650">充电电流 ≈ 0</text><text x="526" y="292" font-size="28" fill="#60737c" text-anchor="middle" font-weight="650">电荷、电场还在</text><text x="360" y="385" font-size="27" fill="#fff6dc" text-anchor="middle" font-weight="650">理想直流稳态：几乎不再充电</text></g></svg>