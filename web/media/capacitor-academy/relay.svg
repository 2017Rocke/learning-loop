<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405" role="img" aria-label="星灯工坊 · 芯片突然忙起来"><defs><marker id="blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#317eb2"/></marker><marker id="purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9260ac"/></marker><marker id="coral" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc775d"/></marker><marker id="mint" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62d4ba"/></marker></defs><desc>芯片与电容跨接在同一供电和回流线之间。蓝箭头表示电源供给，绿箭头表示电容沿外路暂补的约定电流：上端流向芯片，经过芯片后回到下端，不穿过电容绝缘间隙。这是突忙时刻的定性示意，不按电流数值比例绘图。</desc><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="720" height="405" rx="20" fill="#182a42" stroke="none" stroke-width="2"/><rect x="16" y="66" width="688" height="286" rx="18" fill="#f7f2de" stroke="#bc9c5c" stroke-width="2"/><path d="M29 25L42 17L55 25V47L42 55L29 47Z" fill="#62d4ba" stroke="#d4b676" stroke-width="2"/><path d="M34 36H50" fill="none" stroke="#38505e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="38" cy="33" r="2" fill="#23394a" stroke="none" stroke-width="2"/><circle cx="47" cy="33" r="2" fill="#23394a" stroke="none" stroke-width="2"/><text x="76" y="45" font-size="30" fill="#fff6dc" text-anchor="start" font-weight="650">星灯工坊 · 芯片突然忙起来</text><path d="M88 150V109H609V163M88 252V311H609V241M360 109V178M360 236V311" fill="none" stroke="#6d8492" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="88" cy="201" r="50" fill="#e3ece8" stroke="#6d8492" stroke-width="3"/><text x="88" y="211" font-size="29" fill="#263b4e" text-anchor="middle" font-weight="650">电源</text><rect x="554" y="163" width="110" height="78" rx="10" fill="#e5dff0" stroke="#957aa6" stroke-width="2"/><text x="609" y="211" font-size="32" fill="#263b4e" text-anchor="middle" font-weight="650">芯片</text><rect x="318" y="178" width="84" height="15" rx="2" fill="#c7aa6f" stroke="none" stroke-width="2"/><rect x="318" y="222" width="84" height="15" rx="2" fill="#c7aa6f" stroke="none" stroke-width="2"/><text x="360" y="213" font-size="23" fill="#647c7a" text-anchor="middle" font-weight="650">绝缘</text><text x="360" y="286" font-size="29" fill="#263b4e" text-anchor="middle" font-weight="650">电容</text><path d="M173 109H236" fill="none" stroke="#317eb2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/><path d="M360 166V134" fill="none" stroke="#62d4ba" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M360 297V255" fill="none" stroke="#62d4ba" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M422 109H493" fill="none" stroke="#62d4ba" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M536 311H451" fill="none" stroke="#62d4ba" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mint)"/><text x="208" y="156" font-size="25" fill="#317eb2" text-anchor="middle" font-weight="650">还没补齐</text><text x="491" y="285" font-size="27" fill="#286e5c" text-anchor="middle" font-weight="650">暂补缺口</text><text x="360" y="385" font-size="27" fill="#fff6dc" text-anchor="middle" font-weight="650">绿色＝约定电流；之后由电源回充</text></g></svg>