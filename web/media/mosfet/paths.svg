<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-label="小信号指挥，电源出力" width="720" height="405" aria-describedby="star-workshop-description"><defs><marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2775A6" /></marker><marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7352A0" /></marker><marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#BF514A" /></marker><linearGradient id="workshop-night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17233F" /><stop offset="1" stop-color="#24324C" /></linearGradient><linearGradient id="workshop-paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF4DB" /><stop offset="1" stop-color="#f5e7c8" /></linearGradient></defs><desc id="star-workshop-description">原创「星灯工坊」外观：深靛蓝星空边框、黄铜色圆拱书架和悬浮笔记环绕暖羊皮纸课堂；左上角为薄荷色切面晶体灯灵，带悬浮铜环和简洁表情。装饰不表示电路机制。紫色控制路径从3.3V GPIO通向MOS栅极G，蓝色供电路径从5V外部电源经负载、漏极D、源极S返回电源负端。GPIO和源极共地，控制信号与负载供电分开；线条为电路关系示意。</desc><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif"><g id="star-workshop-frame" aria-hidden="true">
